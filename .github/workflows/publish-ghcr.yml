name: Publish Docker image to GHCR

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*', 'release-*' ]

permissions:
  contents: read
  packages: write

# Superseded branch builds are cancelled so only the newest commit publishes.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Generate the image tags/labels once so the per-architecture builds agree.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      json: ${{ steps.meta.outputs.json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

  # Each architecture builds natively (no QEMU) and is pushed by digest.
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # No type=gha cache here: mode=max would upload the ~1.5GB Caddy
          # builder stage every run (minutes) to save a ~90s build. The native
          # cross-compiled build is faster than the cache round-trip.

      - name: Record image digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
        env:
          digest: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-architecture digests into one multi-arch manifest with tags.
  merge:
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          cd /tmp/digests
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ needs.prepare.outputs.json }}

      - name: Inspect manifest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Make GHCR package public (try org then user)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for scope in orgs users; do
            url="https://api.github.com/${scope}/${OWNER}/packages/container/${REPO_NAME}/visibility"
            echo "PATCH $url"
            status=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$url" -d '{"visibility":"public"}' || true)
            if [ "$status" = "200" ] || [ "$status" = "201" ] || [ "$status" = "204" ]; then
              echo "Package visibility set to public via $scope API"
              exit 0
            fi
          done
          echo "Could not set package visibility automatically; set it manually in the GitHub UI under Packages if needed."
          exit 0
